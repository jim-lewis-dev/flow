plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'dev.jimlewis.flow'
    compileSdk 35
    buildToolsVersion '35.0.0'
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'dev.jimlewis.flow.preview'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.3.2-preview'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.includeAndroidResources = true }
    if (System.getenv('FLOW_ANDROID_KEYSTORE')) {
        signingConfigs {
            preview {
                storeFile file(System.getenv('FLOW_ANDROID_KEYSTORE'))
                storePassword System.getenv('FLOW_ANDROID_KEY_PASSWORD')
                keyAlias 'flow-preview'
                keyPassword System.getenv('FLOW_ANDROID_KEY_PASSWORD')
            }
        }
        buildTypes {
            debug { signingConfig signingConfigs.preview }
            release { signingConfig signingConfigs.preview }
        }
    }
    buildTypes { release { minifyEnabled false } }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

chaquopy {
    defaultConfig { version '3.12' }
    sourceSets {
        debug {
            srcDir '../../tests'
            include 'test_mobile*.py', 'test_dates.py'
        }
        main {
            srcDir '../../'
            include 'flowledger/**', 'mobile/**', 'examples/**'
            exclude '**/__pycache__/**', '**/*.pyc', 'mobile/preview_server.py'
        }
    }
}
